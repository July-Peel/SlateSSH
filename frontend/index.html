<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SlateSSH">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SlateSSH · 随身 SSH 终端与远程文件工作台">
  <meta name="theme-color" content="#090a0f">
  <title>SlateSSH // Terminal Console</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="shortcut icon" href="/assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/assets/icons/site.webmanifest">
  <link rel="stylesheet" href="/assets/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260910_pwa_v4">
</head>
<body class="term-body">
  <div id="app" x-data="shadowApp()" class="app theme-dark" :class="{ 'keyboard-open': isKeyboardOpen }" x-cloak>
    
    <header class="app-chrome" x-show="authenticated">
      <a class="app-brand" href="/" @click.prevent="authenticated && sessions.length ? openMobilePanel('hosts') : null" aria-label="SlateSSH 主机目录"><span class="brand-glyph" aria-hidden="true">&gt;_</span> SlateSSH<span class="chrome-path" x-text="authenticated ? '~/workspace' : '~/login'"></span></a>
      <div class="chrome-actions">
        <span class="network-state" :class="isOnline ? '' : 'offline'" role="status"><span class="status-dot"></span><span x-text="isOnline ? 'ONLINE' : 'OFFLINE'"></span></span>
        <button class="term-btn-mini" x-show="!isStandalone" @click="installApp()" aria-label="安装 SlateSSH 应用">[ 安装 ]</button>
        <button class="term-btn-mini" x-show="isMobile && sessions.length" @click="openMobilePanel('hosts')" :aria-expanded="showMobileMenu" aria-label="打开主机目录">[ Hosts ]</button>
      </div>
    </header>
    <div class="app-notice" x-show="!isOnline" role="status">[OFFLINE] 网络已离线。应用界面仍可打开，连接服务器需要恢复网络。</div>
    <div class="app-notice update-notice" x-show="updateAvailable" role="status">
      <span x-text="sessions.length ? '新版本已就绪，关闭所有会话后可更新。' : '新版本已就绪。'"></span>
      <button class="term-btn-mini" @click="applyAppUpdate()" :disabled="sessions.length > 0">[ 更新 ]</button>
    </div>
    <div class="modal-backdrop" x-show="showInstallHelp" @click.self="showInstallHelp = false" x-effect="syncDialog($el, showInstallHelp)" role="dialog" aria-modal="true" aria-label="安装 SlateSSH">
      <section class="install-card">
        <div class="modal-head"><span class="modal-title">=== [ INSTALL SLATESSH PWA ] ===</span><button class="term-btn-mini" @click="showInstallHelp = false">[ Close X ]</button></div>
        <div class="install-content"><p>Safari: 点击分享按钮 -&gt;「添加到主屏幕」-&gt; 开启独立应用窗口体验。</p><p x-show="!secureContext" class="term-msg info">[NOTE] 请使用 HTTPS 地址以启用离线加载与应用更新。</p></div>
      </section>
    </div>

    <!-- Booting screen (only when not authenticated) -->
    <template x-if="booting && !authenticated && !needsSetup">
      <div class="auth-page term-page term-tty-screen">
        <div class="term-boot-line">
          <span class="term-prompt">system:</span> Initializing SlateSSH secure terminal gateway...<span class="term-cursor">_</span>
        </div>
      </div>
    </template>

    <!-- First time setup screen -->
    <template x-if="!booting && needsSetup">
      <div class="auth-page term-page">
        <pre class="term-ascii-banner">
  ____  _       _       ____ ____  _   _ 
 / ___|| | __ _| |_ ___/ ___/ ___|| | | |
 \___ \| |/ _` | __/ _ \___ \___ \| |_| |
  ___) | | (_| | ||  __/___) |__) |  _  |
 |____/|_|\__,_|\__\___|____/____/|_| |_|
</pre>
        <div class="term-subbanner">&gt;&gt;&gt; SlateSSH Initial Setup: Create Administrator &lt;&lt;&lt;</div>
        <form @submit.prevent="setup()" class="term-auth-form">
          <div class="term-prompt-row">
            <span class="term-prompt">create admin username:</span>
            <input x-model="setupForm.username" autocomplete="username" class="term-input" placeholder="admin" aria-label="管理员用户名" autocapitalize="none" autocorrect="off" required>
          </div>
          <div class="term-prompt-row">
            <span class="term-prompt">enter new password:</span>
            <input x-model="setupForm.password" type="password" autocomplete="new-password" aria-label="管理员密码" class="term-input" placeholder="••••••••" required>
          </div>
          <div class="term-prompt-row">
            <span class="term-prompt">confirm password:</span>
            <input x-model="setupForm.confirmPassword" type="password" autocomplete="new-password" aria-label="管理员密码" class="term-input" placeholder="••••••••" required>
          </div>
          <p class="term-msg error" x-show="error" x-text="error"></p>
          <div class="term-form-actions">
            <button class="term-btn primary" type="submit">[ Execute Setup ]</button>
          </div>
        </form>
      </div>
    </template>

    <!-- Pure Linux native console login screen (TTY1) -->
    <template x-if="!booting && !needsSetup && !authenticated">
      <main class="auth-page term-page term-tty-screen" @click="focusLoginInput(true)">
        <section class="auth-console term-tty-console" aria-labelledby="login-title">
          <div class="term-tty-banner">
            <div>SlateSSH Linux 6.8.0-slatessh (tty1)</div>
            <div class="term-tty-motd">Type authorized credentials to establish session.</div>
          </div>

          <div class="term-tty-error" x-show="error" x-text="error" role="alert"></div>

          <form @submit.prevent="loginStep === 'username' ? handleUsernameSubmit() : login()" class="term-tty-form" autocomplete="off">
            <!-- Step 1: Username prompt -->
            <div class="term-tty-line">
              <label for="term-login-username" class="term-tty-prompt">slatessh login:</label>
              <template x-if="loginStep === 'username'">
                <div class="term-tty-input-row">
                  <input
                    id="term-login-username"
                    name="username"
                    x-model="loginForm.username"
                    type="text"
                    autocomplete="off"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    enterkeyhint="next"
                    class="term-tty-input"
                    autofocus
                    required
                  >
                  <span class="term-cursor" aria-hidden="true">_</span>
                </div>
              </template>
              <template x-if="loginStep === 'password'">
                <span class="term-tty-val" x-text="loginForm.username" @click.stop="resetLoginStep()" title="Click to change username"></span>
              </template>
            </div>

            <!-- Step 2: Password prompt -->
            <div class="term-tty-line" x-show="loginStep === 'password'">
              <label for="term-login-password" class="term-tty-prompt">Password:</label>
              <div class="term-tty-input-row">
                <input
                  id="term-login-password"
                  name="password"
                  x-model="loginForm.password"
                  type="password"
                  autocomplete="off"
                  autocapitalize="none"
                  autocorrect="off"
                  spellcheck="false"
                  enterkeyhint="go"
                  class="term-tty-input"
                  @keydown.backspace="if (!loginForm.password) resetLoginStep()"
                  @keydown.escape.prevent="resetLoginStep()"
                >
                <span class="term-cursor" aria-hidden="true">_</span>
              </div>
            </div>

            <button type="submit" class="term-hidden-submit" tabindex="-1" aria-hidden="true"></button>
          </form>

          <!-- Subtle mobile helper buttons -->
          <div class="term-tty-sub-hint" x-show="isMobile">
            <button type="button" class="term-btn-mini" x-show="loginStep === 'username'" @click.stop="handleUsernameSubmit()">[ Next ↵ ]</button>
            <button type="button" class="term-btn-mini primary" x-show="loginStep === 'password'" :disabled="authSubmitting" @click.stop="login()">
              <span x-text="authSubmitting ? '[ Authenticating... ]' : '[ Login ↵ ]'"></span>
            </button>
            <button type="button" class="term-btn-mini" x-show="loginStep === 'password'" @click.stop="resetLoginStep()">[ Back ]</button>
          </div>

        </section>
      </main>
    </template>

    <!-- Main Workspace Area -->
    <template x-if="authenticated">
      <div class="workspace-root">

        <!-- INITIAL STATE: Minimal Linux Host Launcher when no active session -->
        <template x-if="!sessions.length">
          <div class="centered-launcher-wrap">
            <div class="launcher-term-container">
              <div class="launcher-cli-header">
                <span class="term-prompt">user@slatessh:~$</span>
                <span class="cli-cmd">hosts --list</span>
                <span class="cli-meta" x-text="'[' + filteredConnections.length + '/' + connections.length + ' saved]'"></span>
              </div>
              
              <!-- Clean minimal CLI search & action bar -->
              <div class="launcher-cli-bar">
                <div class="launcher-search-box">
                  <span class="term-prompt">filter&gt;</span>
                  <input x-model="connectionQuery" type="search" aria-label="搜索主机或 IP" placeholder="search host or ip..." class="term-cli-search" autocomplete="off">
                  <button x-show="connectionQuery" @click="connectionQuery = ''" class="term-btn-mini">[x]</button>
                </div>
                <div class="launcher-actions-top">
                  <button class="term-btn primary" @click="newConnection('SSH', 'manager')">[ + New Host ]</button>
                  <button class="term-btn" @click="showConnectionManager = true">[ Manager ]</button>
                  <button class="term-btn" @click="logout()">[ Logout ]</button>
                </div>
              </div>

              <!-- Monospace host table seamless with background -->
              <div class="launcher-list-wrap">
                <div class="launcher-table-head">
                  <div class="launcher-table-head-info">
                    <span class="col-idx">#</span>
                    <span class="col-type">TYPE</span>
                    <span class="col-name">NAME</span>
                    <span class="col-dest">TARGET HOST</span>
                  </div>
                  <span class="col-act" style="width: 190px;"></span>
                </div>
                <div class="launcher-table-rows">
                  <template x-for="(connection, idx) in filteredConnections" :key="connection.id">
                    <div class="launcher-row" @click="openSession(connection)">
                      <div class="launcher-row-info">
                        <span class="col-idx" x-text="'[' + (idx + 1) + ']'"></span>
                        <span class="col-type"><span class="term-badge" x-text="connection.type || 'SSH'"></span></span>
                        <span class="col-name"><strong x-text="connection.name"></strong></span>
                        <span class="col-dest" x-text="(connection.username || 'root') + '@' + connection.host + ':' + connection.port"></span>
                      </div>
                      <div class="col-act" @click.stop>
                        <button class="term-btn primary" @click="openSession(connection)" :disabled="connection.connecting">
                          <span x-show="!connection.connecting">[ Connect ]</span>
                          <span x-show="connection.connecting" x-text="'[ ' + currentSpinner + ' Connecting... ]'"></span>
                        </button>
                        <button class="term-btn" @click="testSavedConnection(connection.id)">[ Test ]</button>
                        <button class="term-btn" @click="editConnection(connection, 'manager')">[ Edit ]</button>
                      </div>
                    </div>
                  </template>
                  <div class="launcher-empty" x-show="!connections.length">
                    -- No hosts saved. Click [ + New Host ] to add a connection. --
                  </div>
                  <div class="launcher-empty" x-show="connections.length && !filteredConnections.length">
                    -- No matching hosts found for search. --
                  </div>
                </div>
              </div>

            </div>
          </div>
        </template>

        <!-- ACTIVE STATE: Seamless 3-Panel Terminal Layout -->
        <template x-if="sessions.length > 0">
          <div class="main-grid" :class="{ 'sidebar-hidden': !showSidebar, 'utilities-hidden': !(showSftpWidget || showStatusWidget) }">
            
            <button class="drawer-scrim" x-show="isMobile && showMobileMenu" @click="showMobileMenu = false" aria-label="关闭主机目录"></button>
            <!-- LEFT PANEL: Host Directory -->
            <aside class="connection-panel" x-show="isMobile ? showMobileMenu : showSidebar" :class="isMobile ? (showMobileMenu ? 'mobile-drawer left open' : 'mobile-drawer left') : ''">
              <div class="panel-section-title">
                <span>// HOST DIRECTORY</span><button x-show="isMobile" class="term-btn-mini" @click="showMobileMenu = false" aria-label="关闭主机目录">[ × ]</button>
                <button class="term-btn" @click="newConnection('SSH', 'sidebar')" title="Add connection">[+ New]</button>
              </div>

              <div class="term-search-inline">
                <span class="term-prompt">&gt;</span>
                <input x-model="connectionQuery" type="search" placeholder="filter hosts..." class="term-input" autocomplete="off">
                <button x-show="connectionQuery" @click="connectionQuery = ''" class="term-btn-mini">[x]</button>
              </div>

              <div class="connection-list">
                <template x-for="connection in filteredConnections" :key="connection.id">
                  <div class="connection-item" :class="isConnectionActive(connection) ? 'active' : ''" @click="openSession(connection)">
                    <div class="connection-main">
                      <span class="term-badge" x-text="connection.connecting ? currentSpinner : (connection.type || 'SSH')"></span>
                      <span class="item-name" x-text="connection.name"></span>
                    </div>
                    <div class="connection-tools">
                      <button @click.stop="testSavedConnection(connection.id)" class="term-btn-mini" title="Test Connection">[T]</button>
                      <button @click.stop="editConnection(connection, 'sidebar')" class="term-btn-mini" title="Edit Connection">[E]</button>
                    </div>
                  </div>
                </template>
                <div class="empty-term" x-show="!connections.length">-- No saved hosts --</div>
                <div class="empty-term" x-show="connections.length && !filteredConnections.length">-- No matches --</div>
              </div>

              <!-- Sidebar bottom collapse and manager controls -->
              <div class="connection-panel-bottom">
                <button class="term-btn" @click="showConnectionManager = true">[ Manager ]</button>
                <button class="term-btn" @click="isMobile ? showMobileMenu = false : toggleSidebarPanel()"><span x-text="isMobile ? '[ 关闭 ]' : '[ &lt;&lt; Collapse ]'"></span></button>
              </div>
            </aside>

            <!-- Expander for sidebar when collapsed -->
            <button x-show="!isMobile && !showSidebar" @click="toggleSidebarPanel()" class="sidebar-edge-toggle" title="Expand Host List">[ &gt;&gt; Hosts ]</button>

            <!-- CENTER PANEL: Terminal Command Stage -->
            <section class="terminal-panel" :class="isFullscreen ? 'has-fullscreen' : ''">
              
              <!-- Tab bar -->
              <div class="tabbar">
                <template x-for="(tab, idx) in sessions" :key="tab.id">
                  <div class="tab-wrapper" :class="activeSessionId === tab.id ? 'active' : ''">
                    <button @click="activateSession(tab.id)" class="tab" :class="activeSessionId === tab.id ? 'active' : ''">
                      <span class="tab-badge" x-text="'#' + (idx + 1)"></span>
                      <span class="tab-type" x-text="'[' + (tab.connecting ? currentSpinner : (tab.type || 'SSH')) + ']'"></span>
                      <span class="tab-name" x-text="tab.name"></span>
                    </button>
                    <button class="tab-close" @click="closeTab(tab.id)" :aria-label="'关闭会话 ' + tab.name">×</button>
                  </div>
                </template>
                <button class="tab-new" @click="showConnectionManager = true" title="New Session">[ + ]</button>
                <div style="flex:1"></div>
                <button x-show="!isMobile && !(showSftpWidget || showStatusWidget)" @click="toggleUtilityPanel()" class="term-btn-mini" title="Show Side Panel">[ Files &gt;&gt; ]</button>
              </div>

              <!-- Terminal Command Bar -->
              <div class="terminal-commandbar" x-show="activeSessionId && !isMobile">
                <button class="term-btn" @click="openTerminalCopyViewer()">[ Copy ]</button>
                <button class="term-btn" @click="openTerminalPasteBox()">[ Paste ]</button>
                <button class="term-btn" @click="clearActiveTerminal()">[ Clear ]</button>
                <div class="terminal-search-box" x-show="!isMobile">
                  <span class="term-prompt">find:</span>
                  <input x-model="terminalSearch" @keydown.enter="searchTerminal()" placeholder="search terminal buffer..." class="term-input">
                </div>
                <button class="term-btn" x-show="!isMobile" @click="findPreviousTerminalResult()">[ &lt; Prev ]</button>
                <button class="term-btn" x-show="!isMobile" @click="findNextTerminalResult()">[ Next &gt; ]</button>
                <button @click="toggleFullscreen()" class="term-btn" x-text="isFullscreen ? '[ Window ]' : '[ Fullscreen ]'"></button>
              </div>

              <div class="session-notice" x-show="sessions.some(tab => tab.id === activeSessionId && tab.type !== 'RDP' && !tab.connected && !tab.connecting && !tab.error)" role="status"><span>[!] 会话已断开</span><button class="term-btn-mini" @click="reconnectActiveSession()" :disabled="!isOnline">[ 重新连接 ]</button></div>

              <!-- Terminal viewport stage -->
              <div class="terminal-stage" :class="isFullscreen ? 'fullscreen' : ''">
                <!-- Floating Exit Fullscreen Button -->
                <button x-show="isFullscreen" @click="toggleFullscreen()" class="term-fullscreen-exit-btn" title="Exit Fullscreen (ESC)">
                  [ Exit Fullscreen X ]
                </button>
                
                <!-- Terminal Output Buffer Fullscreen Copy View -->
                <div x-show="terminalCopyViewer.visible" x-effect="syncDialog($el, terminalCopyViewer.visible)" role="dialog" aria-modal="true" aria-label="复制终端输出" class="terminal-copy-viewer" @click.stop>
                  <div class="terminal-copy-head">
                    <span class="copy-head-title">=== [ TERMINAL TEXT BUFFER ] ===</span>
                    <div class="copy-head-actions">
                      <button class="term-btn-mini" @click="selectAllCopyViewer()">[ Select All ]</button>
                      <button class="term-btn-mini primary" @click="copyAllFromViewer()">[ Copy ]</button>
                      <button class="term-btn-mini" @click="closeTerminalCopyViewer()">[ Close X ]</button>
                    </div>
                  </div>
                  <textarea aria-label="终端输出" readonly x-model="terminalCopyViewer.text" spellcheck="false" class="term-copy-textarea"></textarea>
                </div>

                <div x-show="terminalPasteBox.visible" x-effect="syncDialog($el, terminalPasteBox.visible)" role="dialog" aria-modal="true" aria-label="粘贴命令" class="terminal-paste-popover" @click.stop>
                  <div class="terminal-paste-head">=== PASTE TEXT TO PTY ===</div>
                  <textarea aria-label="待粘贴的命令" autocapitalize="none" autocorrect="off" spellcheck="false" x-model="terminalPasteBox.text" placeholder="Type or paste commands here..." class="term-textarea" @keydown.ctrl.enter.prevent="sendTerminalPasteText()" @keydown.meta.enter.prevent="sendTerminalPasteText()"></textarea>
                  <div class="terminal-paste-actions">
                    <button class="term-btn" @click="closeTerminalPasteBox()">[ Cancel ]</button>
                    <button class="term-btn primary" @click="sendTerminalPasteText()">[ Send to PTY ]</button>
                  </div>
                </div>

                <template x-for="tab in sessions" :key="tab.id + '-terminal'">
                  <div x-show="activeSessionId === tab.id" class="terminal-wrap">
                    
                    <!-- Terminal Connecting Stream: Pure Linux SSH output -->
                    <template x-if="tab.connecting || tab.error">
                      <div class="terminal-connecting-screen">
                        <div class="conn-term-stream">
                          <div class="conn-line dim">OpenSSH_9.6p1, OpenSSL 3.0.13</div>
                          <div class="conn-line">
                            <span class="term-prompt">debug1:</span> Connecting to <strong x-text="(tab.username || 'root') + '@' + (tab.host || 'host') + ':' + (tab.port || 22)"></strong> [<span x-text="tab.host || 'host'"></span>]...
                          </div>

                          <template x-if="tab.connecting">
                            <div class="conn-stream-body">
                              <div class="conn-line" x-show="getConnectingStep(tab) >= 1">
                                <span class="term-prompt">debug1:</span> TCP connection established to <span x-text="(tab.host || '') + ':' + (tab.port || 22)"></span>
                              </div>
                              <div class="conn-line" x-show="getConnectingStep(tab) >= 2">
                                <span class="term-prompt">debug1:</span> SSH-2.0 handshake & cipher suite agreement.
                              </div>
                              <div class="conn-line" x-show="getConnectingStep(tab) >= 3">
                                <span class="term-prompt">debug1:</span> User authentication & remote PTY allocation.
                              </div>
                              <div class="conn-line active-line">
                                <span class="conn-spinner-glyph" x-text="currentSpinner"></span>
                                <span class="conn-progress-label" x-text="getConnectingStatusText(tab)"></span>
                                <span class="conn-timer-badge" x-text="'[' + getConnectingElapsed(tab) + ']'"></span>
                              </div>
                              <div class="conn-actions-line">
                                <button class="term-btn-mini" @click="closeTab(tab.id)">[ Cancel Connection ]</button>
                              </div>
                            </div>
                          </template>

                          <template x-if="tab.error">
                            <div class="conn-stream-error">
                              <div class="conn-line error-line">
                                <span class="term-prompt error">ssh: connect to host <span x-text="tab.host || 'host'"></span>:</span>
                                <span class="error-msg-text" x-text="tab.error"></span>
                              </div>
                              <div class="conn-line dim">
                                Connection rejected or remote host unreachable. Check network, port and credentials.
                              </div>
                              <div class="conn-actions-line">
                                <button class="term-btn primary" @click="retryConnection(tab)">[ Retry Connection ]</button>
                                <button class="term-btn" @click="closeTab(tab.id)">[ Close Tab ]</button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                    <template x-if="!tab.connecting && !tab.error">
                      <div style="width:100%;height:100%;">
                        <template x-if="tab.type === 'RDP'">
                          <div class="rdp-surface" :id="'rdp-' + tab.id"></div>
                        </template>
                        <template x-if="tab.type !== 'RDP'">
                          <div :id="'terminal-' + tab.id" class="terminal-surface"></div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Pinned controls sit outside the horizontal key scroller. -->
              <div class="terminal-mobile-dock" x-show="isMobile && activeSessionId">
                <button type="button" class="dock-tool-button" @click="openMobilePanel('tools')" aria-label="打开终端工具" :aria-expanded="showMobileTools">···</button>
                <div class="terminal-mobile-bar" x-show="activeSessionType() !== 'RDP'" x-init="setupMobileBar($el)" @click="handleMobileBarClick($event)" role="toolbar" aria-label="终端快捷键">
                  <button type="button" class="mob-btn" data-action="quick" data-key="escape" title="Escape">ESC</button>
                  <button type="button" class="mob-btn" data-action="quick" data-key="tab" title="Tab 补全">TAB</button>
                  <button type="button" class="mob-btn" data-action="ctrl" :class="ctrlKeyActive ? 'active' : ''" :aria-pressed="ctrlKeyActive" title="Ctrl 组合键">CTRL</button>
                  <button type="button" class="mob-btn danger" data-action="quick" data-key="interrupt" title="中断 Ctrl+C">^C</button>
                  <button type="button" class="mob-btn primary" data-action="paste" title="粘贴剪贴板">PASTE</button>
                  <button type="button" class="mob-btn" data-action="quick" data-key="up" aria-label="方向键 上">↑</button>
                  <button type="button" class="mob-btn" data-action="quick" data-key="down" aria-label="方向键 下">↓</button>
                  <button type="button" class="mob-btn" data-action="quick" data-key="left" aria-label="方向键 左">←</button>
                  <button type="button" class="mob-btn" data-action="quick" data-key="right" aria-label="方向键 右">→</button>
